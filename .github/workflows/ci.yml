name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 本项目零运行时依赖；这里只装 devDependencies（当前没有）
      - name: Install
        run: npm install --no-audit --no-fund --ignore-scripts

      # client/bundle.js 是构建产物，必须与源码同步提交
      - name: Check client bundle is up to date
        run: |
          node scripts/build-client.mjs
          git diff --exit-code -- client/bundle.js

      - name: Test
        run: npm test

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 发布物里不能出现 vendor/、research/、二进制或数据库
      - name: Inspect packed files
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const info = require("./pack.json")[0];
            const bad = info.files.map((f) => f.path).filter((p) =>
              p.startsWith("vendor/") || p.startsWith("research/") ||
              p.startsWith("test/") || p.endsWith(".sqlite") || p.endsWith(".sock"));
            if (bad.length) { console.error("不该发布的文件:", bad); process.exit(1); }
            const need = ["client/bundle.js", "cordis.patch.yml", "src/index.js"];
            const have = new Set(info.files.map((f) => f.path));
            const missing = need.filter((p) => !have.has(p));
            if (missing.length) { console.error("缺少必需文件:", missing); process.exit(1); }
            console.log("pack ok:", info.files.length, "files,", Math.round(info.size / 1024), "KiB");
          '
